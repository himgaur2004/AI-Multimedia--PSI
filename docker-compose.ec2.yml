# PSI — EC2 Production Stack with Automatic HTTPS via Caddy + nip.io
# Runs on AWS EC2 (Free Tier t2.micro / t3.micro)
# 100% Free: Automatic SSL via Let's Encrypt for <EC2_PUBLIC_IP>.nip.io

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: psi-backend
    restart: always
    environment:
      - PROJECT_NAME=PSI - AI Document & Multimedia Q&A
      - VERSION=1.0.0
      - SECRET_KEY=${SECRET_KEY:-psi_aws_ec2_production_secret_key_2026}
      - DATABASE_URL=${DATABASE_URL:-mongodb+srv://himgaursingh_db_user:himgaursingh1@cluster0.ieebzgz.mongodb.net/psi_db?authSource=admin&retryWrites=true&w=majority}
      - MONGODB_URL=${MONGODB_URL:-mongodb+srv://himgaursingh_db_user:himgaursingh1@cluster0.ieebzgz.mongodb.net/psi_db?authSource=admin&retryWrites=true&w=majority}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://ai-multimedia-psi.vercel.app,http://localhost:5173,http://localhost:3000}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - PORT=8000
    volumes:
      - psi_uploads:/app/uploads
    networks:
      - psi-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    container_name: psi-caddy-ssl
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - psi-net

networks:
  psi-net:
    driver: bridge

volumes:
  psi_uploads:
  caddy_data:
  caddy_config:
